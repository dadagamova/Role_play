<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ролевая игра · Управление изменениями</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f0f4fb; padding:1.25rem; color:#1a1a18; min-height:100vh; }
body.r-m { background:#f0f4fb; } body.r-e { background:#f3f2fc; } body.r-o { background:#eef7f3; }
.wrap { max-width:640px; margin:0 auto; }
.header { background:#042C53; color:#fff; border-radius:12px; padding:14px 18px; margin-bottom:14px; transition:background .2s; }
.r-e .header { background:#534AB7; } .r-o .header { background:#1D9E75; }
.header-role { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-bottom:4px; }
.header-title { font-size:16px; font-weight:600; }
.header-sub { font-size:12px; opacity:.8; margin-top:4px; }
.box { background:#fff; border-radius:12px; border:1px solid #c5d8f0; padding:16px; margin-bottom:14px; }
.q { font-size:13px; font-weight:700; margin-bottom:8px; }
.q + .q { margin-top:16px; }
.pick { display:flex; gap:8px; }
.pick button { flex:1; padding:14px 6px; border-radius:10px; border:1.5px solid #c5d8f0; background:#fff; font-size:15px; font-weight:700; color:#042C53; cursor:pointer; }
.pick button.on { background:#042C53; color:#fff; border-color:#042C53; }
.go { width:100%; margin-top:18px; padding:13px; border:none; border-radius:10px; background:#042C53; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
.go:disabled { background:#c5d0de; cursor:default; }
.hint { font-size:12px; color:#777; line-height:1.55; margin-top:10px; }
.rot { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.rot th, .rot td { border:1px solid #e3ebf6; padding:6px; text-align:center; }
.rot th { background:#f5f8fc; font-weight:700; color:#042C53; }
.rot td.me { background:#042C53; color:#fff; font-weight:700; }
.nav { background:#fff; border-radius:12px; border:1px solid #c5d8f0; overflow:hidden; margin-bottom:14px; display:flex; }

.banner { border-radius:12px; padding:14px 16px; margin-bottom:14px; color:#fff; background:#042C53; }
.banner.e { background:#534AB7; } .banner.o { background:#1D9E75; }
.banner-l { font-size:11px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.06em; }

.trio { display:flex; gap:6px; flex-wrap:wrap; }

.lock-ico { font-size:40px; margin-bottom:12px; }

.lock input:focus { border-color:#042C53; }
.lock button { display:block; margin:0 auto; padding:10px 28px; border-radius:8px; border:none; font-size:13px; font-weight:700; color:#fff; cursor:pointer; background:#042C53; }

.manual .pick button { font-size:12px; padding:10px 4px; }

.role-m .meta{ display:inline-block; margin-top:8px; background:rgba(255,255,255,.18); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
.role-m .sit-title{ font-size:12px; font-weight:700; color:#1a1a18; margin:10px 0 5px; }

.role-m .task-text{ font-size:13px; color:#E6F1FB; line-height:1.65; }

.role-m .step p,.role-m .step li{ font-size:12.5px; color:#333; line-height:1.6; }

.role-m .adkar{ width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
.role-m .adkar td{ border-top:1px solid #e3ebf6; padding:6px 6px; vertical-align:top; line-height:1.45; color:#333; }
.role-m .adkar td:first-child{ width:38%; }
.role-m .adkar b{ color:#042C53; display:block; font-size:12px; }
.role-m .adkar span{ color:#777; font-size:11px; }
.role-m .note{ background:#FAEEDA; border-radius:6px; padding:6px 9px; margin-top:7px; font-size:12px; color:#633806; line-height:1.5; }

.role-e .card{ background: white; border-radius: 12px; border: 1px solid #CECBF6; overflow: hidden; }
.role-e .card-header{ padding: 12px 16px; }
.role-e .card-label{ font-size: 11px; font-weight: 600; color: rgba(255,255,255,.65); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.role-e .card-title{ font-size: 15px; font-weight: 700; color: white; line-height: 1.4; }

.role-e .section{ margin-bottom: 14px; }

.role-e .meta{ display:inline-block; margin-top:8px; margin-left:4px; background:rgba(255,255,255,.18); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }

.role-o .ctx-block{ background: white; border-radius: 10px; border: 1px solid #9FE1CB; padding: 10px 12px; margin-bottom: 14px; }
.role-o .ctx-title{ font-size: 13px; font-weight: 700; color: #1a1a18; margin-bottom: 4px; }
.role-o .ctx-barrier{ display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-bottom: 5px; }

.role-o .score-wrap{ background: white; border-radius: 12px; border: 1px solid #9FE1CB; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

.role-o .v-great{ background: #E1F5EE; color: #085041; }
.role-o .v-good{ background: #FAEEDA; color: #633806; }
.role-o .v-try{ background: #FCEBEB; color: #791F1F; }

<body>
<div class="wrap">
  <div class="header">
    <p class="header-role">Ролевая игра · Управление изменениями</p>
    <p class="header-title" id="hTitle">Добро пожаловать</p>
    <p class="header-sub" id="hSub">Выбери свой зал и номер в тройке</p>
  </div>

  <div id="start" class="box">
    <p class="q">Твой зал</p>
    <div class="pick" id="pZal"><button data-v="0">🏠 Зал 1</button><button data-v="1">🏠 Зал 2</button></div>
    <p class="q">Твой номер в тройке</p>
    <div class="pick" id="pNum"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
    <p class="hint">Номер называет тренер. Роль в каждом раунде определяется автоматически:</p>
    <table class="rot" id="rotTable"></table>
    <button class="go" id="goBtn" disabled>Начать</button>
  </div>

  <div id="game" class="hidden">
    <div class="nav" id="nav"></div>
    <div id="stage"></div>
    <div class="foot">
      <button class="link" id="chgBtn">Сменить зал или номер</button>
      <button class="link" id="manBtn">Сменить роль вручную</button>
    </div>
    <div class="manual" id="manual">
      <p>Только если тройка неполная или поменялась. Выбери роль на этот раунд:</p>
      <div class="pick" id="pMan"><button data-v="0">Руководитель</button><button data-v="1">Сотрудник</button><button data-v="2">Наблюдатель</button><button data-v="-1">Авто</button></div>
    </div>
  </div>
</div>
<script>
var DATA={"m": {"00": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#042C53;\">\n        <p class=\"card-label\">Раунд 1 · Зал 1</p>\n        <p class=\"card-title\">Переход на CRM-систему</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Компания переходит на новую CRM-систему. Старт через 10 дней. За прошлый квартал потеряли 4 клиентов, задачи терялись в блокнотах.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Состав команды, цели на квартал, клиенты. Меняется только инструмент.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">На этой неделе получить доступы и пройти 2-часовое обучение в четверг. Первый отчёт в CRM через 10 дней. Апдейт в пятницу на общей встрече.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], хочу поговорить о переходе на CRM. Прежде чем рассказать детали, хочу сначала услышать тебя. Как ты вообще к этому относишься?»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>", "01": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#042C53;\">\n        <p class=\"card-label\">Раунд 1 · Зал 2</p>\n        <p class=\"card-title\">Фиксация договорённостей в чате</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Команда месяц работает по стандарту фиксации договорённостей в чате. Последние две недели договорённости у сотрудника снова идут устно. До внедрения стандарта договорённости терялись, были конфликты и срывы.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Стиль общения, доверие в команде. Меняется только одно действие: договорённости фиксируются письменно.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">С этой недели договорённости без фиксации в чате не действуют. Апдейт через неделю на общей встрече.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], я заметил, что последние две недели договорённости снова идут устно, без фиксации в чате. Хочу разобраться, что происходит, не с претензией, а честно.»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>", "10": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#185FA5;\">\n        <p class=\"card-label\">Раунд 2 · Зал 1</p>\n        <p class=\"card-title\">Обязательные 1-on-1 раз в две недели</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Компания вводит обязательные 1-on-1 раз в две недели. В прошлом квартале ушли двое сотрудников. На exit-интервью оба сказали: не понимали, куда растут, боялись отвлечь руководителя.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Рабочие процессы, нагрузка, состав команды. Добавляется только 30 минут встречи раз в две недели.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">Первая встреча в пятницу. Перед ней сотрудник получит шаблон с вопросами для самооценки.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], хочу поговорить о новом формате встреч один на один. Что ты уже слышал об этом и как к этому относишься?»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>", "11": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#185FA5;\">\n        <p class=\"card-label\">Раунд 2 · Зал 2</p>\n        <p class=\"card-title\">Реорганизация: объединение с соседним отделом</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Объявлена реорганизация: команда объединяется с соседним отделом. Объединение убирает дублирование, два отдела делали одно и то же. Финальная структура через 3 недели, часть ролей изменится.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Состав твоей группы и текущие проекты. Ближайшие дедлайны нужно закрывать.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">На этой неделе работаем в обычном режиме. Ты собираешь вопросы команды для руководства. Апдейт в пятницу после встречи с директором.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], я знаю, что новость об объединении отделов непростая. Хочу поговорить честно: что ты сейчас думаешь об этом?»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>", "20": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#0F6E56;\">\n        <p class=\"card-label\">Раунд 3 · Зал 1</p>\n        <p class=\"card-title\">Новый стандарт обработки клиентских обращений</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Две недели назад ввели стандарт: каждый тикет закрывается с заполненным полем «причина обращения» и категорией из списка. Сейчас половина тикетов закрывается с пустыми полями. Данные идут в ежемесячный отчёт для приоритизации доработок продукта.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Количество тикетов, нагрузка, дедлайны, состав команды. Добавляются только два поля при закрытии тикета.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">Стандарт обязателен для всех тикетов. Через неделю апдейт: смотрим статистику заполнения.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], хочу обсудить заполнение тикетов: замечаю, что поля часто остаются пустыми. Расскажи, как у тебя с этим обстоят дела?»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>", "21": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#0F6E56;\">\n        <p class=\"card-label\">Раунд 3 · Зал 2</p>\n        <p class=\"card-title\">Новый формат еженедельных отчётов</p>\n        <span class=\"meta\">⏱ Время разговора: 5 минут</span>\n      </div>\n      <div class=\"card-body\">\n        <div class=\"section\">\n          <p class=\"slabel\">Ситуация</p>\n          <div class=\"fact-box\"><p class=\"fact-text\">Компания вводит единый формат еженедельных отчётов из трёх разделов: результаты, риски, следующие шаги. Сейчас команды используют разные форматы, поэтому руководству сложно быстро сопоставлять информацию и принимать решения.</p></div>\n          <p class=\"sit-title\">Что не изменится</p>\n          <div class=\"stays-box\"><p class=\"stays-text\">Требования к качеству и глубине анализа. При необходимости можно добавлять детали и ссылки.</p></div>\n          <p class=\"sit-title\">Сроки и условия</p>\n          <div class=\"action-box\"><p class=\"action-text\">Со следующей недели все отчёты сдаются в новом формате. Через неделю короткое обсуждение того, как новый формат работает.</p></div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Твоя задача</p>\n          <div class=\"task-box\">\n            <p class=\"task-text\">Выясни, что мешает сотруднику принять изменение, и договорись о следующем шаге.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Ход разговора</p>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">1</span>Диагностируй</div>\n            <div class=\"phrase-box\"><p class=\"phrase-l\">Начни разговор с фразы</p><p class=\"phrase-text\">«[Имя], со следующей недели переходим на единый формат отчётов. Прежде чем рассказывать детали, хочу услышать тебя. Как ты к этому относишься?»</p></div>\n            <ul><li>Не предлагай решение, пока не понял причину.</li><li>Задавай открытые вопросы. Не делай вывод по первой реплике: проверь гипотезу ещё одним вопросом.</li></ul>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">2</span>Определи барьер ADKAR</div>\n            <p>По ответам сотрудника определи, чего ему сейчас не хватает, и выбери действие.</p>\n            <table class=\"adkar\">\n              <tr><td><b>A · Awareness</b><span>Не понимает, зачем</span></td><td>Объясни смысл изменения через конкретные факты. Покажи последствия бездействия.</td></tr>\n              <tr><td><b>D · Desire</b><span>Понимает, но не хочет</span></td><td>Признай опасения, выясни личный интерес, предложи выбор там, где он возможен.</td></tr>\n              <tr><td><b>K · Knowledge</b><span>Хочет, но не знает как</span></td><td>Дай понятную инструкцию, покажи пример, подскажи, где получить помощь.</td></tr>\n              <tr><td><b>A · Ability</b><span>Знает, но не получается</span></td><td>Организуй практику, обеспечь поддержку, помоги убрать препятствия.</td></tr>\n              <tr><td><b>R · Reinforcement</b><span>Делал, но вернулся к старому</span></td><td>Выясни причину возврата, согласуй контрольную точку, метрику или механизм закрепления.</td></tr>\n            </table>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">3</span>Выбери действие и используй ЗПДО</div>\n            <p>ЗПДО — конструктор разговора, а не жёсткая последовательность. Сделай акцент на том, что нужно сотруднику.</p>\n            <div class=\"zp\"><span class=\"zp-l\">З</span><p><b>Зачем.</b> Объясни смысл изменения через конкретные факты.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">П</span><p><b>По-новому.</b> Покажи, что меняется и что остаётся прежним.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">Д</span><p><b>Действия.</b> Определи конкретный следующий шаг и нужную поддержку.</p></div>\n            <div class=\"zp\"><span class=\"zp-l\">О</span><p><b>Ответы.</b> Создай пространство для вопросов и сомнений: «Что тебя беспокоит?»</p></div>\n          </div>\n          <div class=\"step\"><div class=\"step-h\"><span class=\"step-n\">4</span>Договорись о следующем шаге</div>\n            <ul><li>Что сотрудник сделает дальше?</li><li>Какая поддержка ему нужна?</li><li>Когда вы вернётесь к результату?</li></ul>\n            <p>Если договориться пока не удалось, выясни, что мешает, и согласуй следующий шаг для продолжения разговора.</p>\n          </div>\n        </div>\n        <div class=\"section\">\n          <p class=\"slabel\">Критерии успеха</p>\n          <div class=\"success-box\">\n            <p class=\"success-item\">Определил барьер ADKAR и проверил гипотезу через вопросы</p>\n            <p class=\"success-item\">Выбрал действие, соответствующее барьеру</p>\n            <p class=\"success-item\">Использовал подходящие элементы ЗПДО, а не проходил их механически</p>\n            <p class=\"success-item\">Согласовал конкретный следующий шаг или выяснил, что пока мешает договорённости</p>\n          </div>\n        </div>\n      </div>\n    </div>"}, "e": {"00": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#534AB7;\"><p class=\"card-label\">Раунд 1 · Зал 1</p><p class=\"card-title\">Переход на CRM-систему</p><span class=\"card-badge\">Барьер: Desire</span>\n      <span class=\"meta\">⏱ 5 минут</span>\n      <div class=\"barrier-desc\">Понимает зачем изменение, но лично не хочет в нём участвовать</div></div>\n      <div class=\"card-body\">\n        <div class=\"section\"><p class=\"slabel\">Ситуация</p><div class=\"ctx-box\"><p class=\"ctx-text\">Ты сидишь на 1-on-1 с руководителем. Он только что попросил тебя остаться после общей встречи чтобы поговорить о переходе на CRM.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя роль</p><div class=\"role-box\"><p class=\"role-text\">Ты старший менеджер, работаешь 5 лет. Пережил уже три «революции» с новыми системами, которые потом тихо умирали. Понимаешь зачем нужна CRM, но лично не хочешь тратить время на переучивание. Дедлайны горят, план горит.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя задача</p><div class=\"task-box\"><p class=\"task-text\">Держи роль до конца и не называй свой барьер: пусть руководитель сам его определит. Открывайся постепенно, когда он задаёт уточняющие вопросы и попадает в точку. Если он сразу убеждает или предлагает решение мимо твоего барьера, соглашайся формально, но не включайся.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Что говоришь</p><div class=\"lines-box\"><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Мы уже внедряли подобное и в итоге все вернулись к Excel.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«У меня сейчас три горящих сделки, на CRM нет времени.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Почему не спросили команду, прежде чем решать?»</p></div><div class=\"line-step\"><span class=\"line-q\">🎭</span><p class=\"line-text\">Соглашаешься формально, но вовлечённости не проявляешь</p></div></div></div>\n        <div class=\"section\"><p class=\"slabel\">Чего ждёшь от руководителя</p><div class=\"want-box\"><p class=\"want-text\">Признания твоего опыта и ответа на вопрос «что лично мне это даст». Если руководитель признаёт прошлый неудачный опыт, чуть открываешься.</p></div></div>\n      </div>\n    </div>", "01": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#534AB7;\"><p class=\"card-label\">Раунд 1 · Зал 2</p><p class=\"card-title\">Фиксация договорённостей в чате</p><span class=\"card-badge\">Барьер: Reinforcement</span>\n      <span class=\"meta\">⏱ 5 минут</span>\n      <div class=\"barrier-desc\">Делал по-новому, потом вернулся к старому. Новая привычка не закрепилась</div></div>\n      <div class=\"card-body\">\n        <div class=\"section\"><p class=\"slabel\">Ситуация</p><div class=\"ctx-box\"><p class=\"ctx-text\">Руководитель написал тебе в чат и попросил встретиться. Ты догадываешься что разговор будет про фиксацию договорённостей.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя роль</p><div class=\"role-box\"><p class=\"role-text\">Ты энергичный, быстро внедряешь новое. Три недели писал в чат все договорённости, но потом начались авральные недели. Писать казалось потерей времени. Скатился к старой схеме.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя задача</p><div class=\"task-box\"><p class=\"task-text\">Держи роль до конца и не называй свой барьер: пусть руководитель сам его определит. Открывайся постепенно, когда он задаёт уточняющие вопросы и попадает в точку. Если он сразу убеждает или предлагает решение мимо твоего барьера, соглашайся формально, но не включайся.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Что говоришь</p><div class=\"lines-box\"><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Да, понимаю что надо, но когда договорились на бегу совсем некогда писать.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Коллеги же понимают и так, зачем формализм?»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Первые недели делал, потом как-то само забылось.»</p></div><div class=\"line-step\"><span class=\"line-q\">🎭</span><p class=\"line-text\">Открыт, не защищаешься, но ищешь рациональное объяснение откату</p></div></div></div>\n        <div class=\"section\"><p class=\"slabel\">Чего ждёшь от руководителя</p><div class=\"want-box\"><p class=\"want-text\">Конкретного инструмента для ситуации «на бегу», а не лекции. Если дать шаблон для быстрой фиксации, сразу соглашаешься попробовать.</p></div></div>\n      </div>\n    </div>", "10": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#534AB7;\"><p class=\"card-label\">Раунд 2 · Зал 1</p><p class=\"card-title\">Обязательные 1-on-1 раз в две недели</p><span class=\"card-badge\">Барьер: Awareness</span>\n      <span class=\"meta\">⏱ 5 минут</span>\n      <div class=\"barrier-desc\">Не понимает зачем нужно изменение и почему нельзя оставить всё как есть</div></div>\n      <div class=\"card-body\">\n        <div class=\"section\"><p class=\"slabel\">Ситуация</p><div class=\"ctx-box\"><p class=\"ctx-text\">Руководитель пригласил тебя на короткую встречу. Ты знаешь что в компании вводят новый формат встреч один на один.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя роль</p><div class=\"role-box\"><p class=\"role-text\">Ты методичный аналитик. Не против 1-on-1 как идеи, но искренне не понимаешь зачем это нужно именно тебе. Ты общаешься с руководителем каждый день. Кажется это формализм ради галочки.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя задача</p><div class=\"task-box\"><p class=\"task-text\">Держи роль до конца и не называй свой барьер: пусть руководитель сам его определит. Открывайся постепенно, когда он задаёт уточняющие вопросы и попадает в точку. Если он сразу убеждает или предлагает решение мимо твоего барьера, соглашайся формально, но не включайся.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Что говоришь</p><div class=\"lines-box\"><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«У нас и так много встреч. Зачем добавлять ещё одну?»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Мы же общаемся каждый день, в чём разница?»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Это нужно компании или реально поможет мне в работе?»</p></div><div class=\"line-step\"><span class=\"line-q\">🎭</span><p class=\"line-text\">Задаёшь уточняющие вопросы, анализируешь, пытаешься понять логику</p></div></div></div>\n        <div class=\"section\"><p class=\"slabel\">Чего ждёшь от руководителя</p><div class=\"want-box\"><p class=\"want-text\">Конкретных фактов и примеров, не абстрактных слов о развитии. Если руководитель покажет реальную проблему которую решает 1-on-1, начнёшь воспринимать серьёзно.</p></div></div>\n      </div>\n    </div>", "11": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#534AB7;\"><p class=\"card-label\">Раунд 2 · Зал 2</p><p class=\"card-title\">Реорганизация: объединение с соседним отделом</p><span class=\"card-badge\">Барьер: Knowledge</span>\n      <span class=\"meta\">⏱ 5 минут</span>\n      <div class=\"barrier-desc\">Хочет делать правильно, но не понимает как. Нужна инструкция или пример</div></div>\n      <div class=\"card-body\">\n        <div class=\"section\"><p class=\"slabel\">Ситуация</p><div class=\"ctx-box\"><p class=\"ctx-text\">Руководитель попросил встретиться после объявления о реорганизации. Ты ещё не знаешь что именно он скажет.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя роль</p><div class=\"role-box\"><p class=\"role-text\">Ты хочешь работать хорошо в новой структуре, понимаешь зачем объединение. Но честно не понимаешь как теперь будет устроена работа, кому подчиняться, как взаимодействовать с новыми коллегами. Неясность вызывает тревогу.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя задача</p><div class=\"task-box\"><p class=\"task-text\">Держи роль до конца и не называй свой барьер: пусть руководитель сам его определит. Открывайся постепенно, когда он задаёт уточняющие вопросы и попадает в точку. Если он сразу убеждает или предлагает решение мимо твоего барьера, соглашайся формально, но не включайся.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Что говоришь</p><div class=\"lines-box\"><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Я понимаю зачем объединяемся, но не понимаю как это будет работать.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Кому я буду подчиняться в новой структуре?»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Как мне взаимодействовать с новыми коллегами?»</p></div><div class=\"line-step\"><span class=\"line-q\">🎭</span><p class=\"line-text\">Открыт, не сопротивляется, но явно растерян и нуждается в конкретике</p></div></div></div>\n        <div class=\"section\"><p class=\"slabel\">Чего ждёшь от руководителя</p><div class=\"want-box\"><p class=\"want-text\">Конкретных ответов как будет устроена работа. Если руководитель даёт понятные шаги и говорит что делать прямо сейчас, успокаиваешься и включаешься.</p></div></div>\n      </div>\n    </div>", "20": "<div class=\"card\">\n      <div class=\"card-header\" style=\"background:#534AB7;\"><p class=\"card-label\">Раунд 3 · Зал 1</p><p class=\"card-title\">Новый стандарт обработки клиентских обращений</p><span class=\"card-badge\">Барьер: Ability</span>\n      <span class=\"meta\">⏱ 5 минут</span>\n      <div class=\"barrier-desc\">Знает как, но на практике не получается. Нужна практика и устранение барьеров</div></div>\n      <div class=\"card-body\">\n        <div class=\"section\"><p class=\"slabel\">Ситуация</p><div class=\"ctx-box\"><p class=\"ctx-text\">Руководитель позвал тебя на короткий разговор. Ты понимаешь что это про заполнение тикетов.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя роль</p><div class=\"role-box\"><p class=\"role-text\">Ты хочешь делать правильно и понимаешь зачем это нужно. Но на практике не получается, список из 40 категорий непонятен, половина звучат похоже. Боишься выбрать не ту и потом переделывать. Проще нажать «закрыть» без заполнения.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Твоя задача</p><div class=\"task-box\"><p class=\"task-text\">Держи роль до конца и не называй свой барьер: пусть руководитель сам его определит. Открывайся постепенно, когда он задаёт уточняющие вопросы и попадает в точку. Если он сразу убеждает или предлагает решение мимо твоего барьера, соглашайся формально, но не включайся.</p></div></div>\n        <div class=\"section\"><p class=\"slabel\">Что говоришь</p><div class=\"lines-box\"><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Я не понимаю какую категорию выбрать.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«Там 40 категорий, они все звучат похоже, я путаюсь.»</p></div><div class=\"line-step\"><span class=\"line-q\">💬</span><p class=\"line-text\">«А если выберу не ту, то потом придётся переделывать?»< v></div>\n    <div class=\"q-block\"><div class=\"q-head\"><div class=\"q-num\">2</div><div><div class=\"q-text\">Выбрал действие под этот барьер?</div><div class=\"q-hint\">Как это выглядит здесь: Признал качество прошлых отчётов. Показал, что экспертиза видна и в новом формате: детали и ссылки можно добавлять.</div></div></div><div class=\"q-opts\"><button class=\"opt-btn\" onclick=\"ans('r2z1',1,'yes',1)\" id=\"r2z1q1-yes\">✓ Да</button><button class=\"opt-btn\" onclick=\"ans('r2z1',1,'partial',0.5)\" id=\"r2z1q1-partial\">~ Частично</button><button class=\"opt-btn\" onclick=\"ans('r2z1',1,'no',0)\" id=\"r2z1q1-no\">✗ Нет</button></div></div>\n    <div class=\"q-block\"><div class=\"q-head\"><div class=\"q-num\">3</div><div><div class=\"q-text\">Использовал ЗПДО по ситуации, а не механически?</div><div class=\"q-hint\">Акцент на «О» и «П»: выслушал сомнения, показал, что остаётся прежним и что выигрывает лично сотрудник.</div></div></div><div class=\"q-opts\"><button class=\"opt-btn\" onclick=\"ans('r2z1',2,'yes',1)\" id=\"r2z1q2-yes\">✓ Да</button><button class=\"opt-btn\" onclick=\"ans('r2z1',2,'partial',0.5)\" id=\"r2z1q2-partial\">~ Частично</button><button class=\"opt-btn\" onclick=\"ans('r2z1',2,'no',0)\" id=\"r2z1q2-no\">✗ Нет</button></div></div>\n    <div class=\"q-block\"><div class=\"q-head\"><div class=\"q-num\">4</div><div><div class=\"q-text\">Договорился о следующем шаге?</div><div class=\"q-hint\">Что сделает сотрудник, какая поддержка нужна, когда вернутся к результату. Или выяснил, что пока мешает договориться.</div></div></div><div class=\"q-opts\"><button class=\"opt-btn\" onclick=\"ans('r2z1',3,'yes',1)\" id=\"r2z1q3-yes\">✓ Да</button><button class=\"opt-btn\" onclick=\"ans('r2z1',3,'partial',0.5)\" id=\"r2z1q3-partial\">~ Частично</button><button class=\"opt-btn\" onclick=\"ans('r2z1',3,'no',0)\" id=\"r2z1q3-no\">✗ Нет</button></div></div>\n    <button class=\"reset-btn\" onclick=\"resetCard('r2z1',4)\">↺ Сбросить</button>"}, "o_pre": "<div class=\"task-box\"><div class=\"time-row\"><span class=\"time-pill\">⏱ 5 минут</span></div><p class=\"task-text\">Отмечай по ходу разговора. Через 5 минут останови раунд, спроси руководителя, как прошёл разговор, и дай обратную связь по схеме внизу.</p></div>", "o_fb": "<div class=\"fb-block\">\n  <div class=\"fb-head\"><div class=\"fb-head-title\">💬 Обратная связь после раунда</div><div class=\"fb-head-sub\">Сначала что сработало, потом одно «по-другому»</div></div>\n  <div class=\"fb-body\">\n    <div class=\"fb-step\" style=\"background:#E1F5EE;\"><div class=\"fb-step-n\" style=\"background:#1D9E75;\">1</div><div><div class=\"fb-step-t\" style=\"color:#085041;\">Сначала, что сработало</div><div class=\"fb-step-s\">1, 2 конкретных момента из разговора</div></div></div>\n    <div class=\"fb-step\" style=\"background:#FAEEDA;\"><div class=\"fb-step-n\" style=\"background:#EF9F27;\">2</div><div><div class=\"fb-step-t\" style=\"color:#633806;\">Что можно было сделать по-другому</div><div class=\"fb-step-s\">1 конкретное предложение</div></div></div>\n  </div>\n</div>"};
var PW={1:'барсук',2:'апельсин'};
var ROLES=[{k:'m',n:'руководитель',t:'👔 Карточка руководителя'},{k:'e',n:'сотрудник',t:'🎭 Карточка сотрудника'},{k:'o',n:'наблюдатель',t:'👁 Карточка наблюдателя'}];
var S={zal:null,num:null,round:0,unlocked:[true,false,false],manual:{}};
function load(){try{var s=JSON.parse(localStorage.getItem('rp_state')||'null');if(s&&s.unlocked)S=s;}catch(e){}}
function save(){try{localStorage.setItem('rp_state',JSON.stringify(S));}catch(e){}}
function roleOf(num,r){return ((num-1-r)%3+3)%3;}
function myRole(r){var m=S.manual[r];return (m===0||m===1||m===2)?m:roleOf(S.num,r);}
function ans(cardId,qi,type,pts){
  if(!scores[cardId]) scores[cardId]=[];
  scores[cardId][qi]={type:type,pts:pts};
  var p=cardId+'q'+qi;
  ['yes','partial','no'].forEach(function(t){var el=document.getElementById(p+'-'+t);if(el)el.className='opt-btn';});
  var el=document.getElementById(p+'-'+type);
  if(el)el.classList.add(type);
  updateScore(cardId,4);
}

function updateScore(cardId,max){
  var arr=scores[cardId]||[];
  var total=arr.reduce(function(s,a){return s+(a?a.pts:0);},0);
  total=Math.round(total*10)/10;
  document.getElementById('s-'+cardId).innerHTML=total+' <span>/ '+max+'</span>';
  var v=document.getElementById('v-'+cardId);
  var pct=total/max;
  if(pct>=0.75){v.textContent='🔥 Отлично';v.className='verdict v-great';}
  else if(pct>=0.5){v.textContent='👍 Хорошо';v.className='verdict v-good';}
  else if(total>0){v.textContent='💡 Над чем поработать';v.className='verdict v-try';}
  else{v.textContent='';v.className='verdict';}
}

function resetCard(cardId,max){
  scores[cardId]=[];
  for(var qi=0;qi<max;qi++){
    var p=cardId+'q'+qi;
    ['yes','partial','no'].forEach(function(t){var el=document.getElementById(p+'-'+t);if(el)el.className='opt-btn';});
  }
  document.getElementById('s-'+cardId).innerHTML='0 <span>/ '+max+'</span>';
  document.getElementById('v-'+cardId).textContent='';
  document.getElementById('v-'+cardId).className='verdict';
}


var scores={};

function rotTable(){
  var h='<tr><th></th><th>Руководитель</th><th>Сотрудник</th><th>Наблюдатель</th></tr>';
  for(var r=0;r<3;r++){h+='<tr><th>Раунд '+(r+1)+'</th>';for(var ro=0;ro<3;ro++){var n=[1,2,3].filter(function(x){return roleOf(x,r)===ro;})[0];h+='<td'+(n===S.num?' class="me"':'')+'>№'+n+'</td>';}h+='</tr>';}
  document.getElementById('rotTable').innerHTML=h;
}
function setPick(id,val){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',String(val)===b.dataset.v);});}
function refreshStart(){setPick('pZal',S.zal);setPick('pNum',S.num);rotTable();document.getElementById('goBtn').disabled=!(S.zal!==null&&S.num);}
document.querySelectorAll('#pZal button').forEach(function(b){b.onclick=function(){S.zal=+b.dataset.v;refreshStart();};});
document.querySelectorAll('#pNum button').forEach(function(b){b.onclick=function(){S.num=+b.dataset.v;refreshStart();};});
document.getElementById('goBtn').onclick=function(){save();showGame();};
document.getElementById('chgBtn').onclick=function(){showStart();};
document.getElementById('manBtn').onclick=function(){document.getElementById('manual').classList.toggle('open');setPick('pMan',S.manual[S.round]===undefined?-1:S.manual[S.round]);};
document.querySelectorAll('#pMan button').forEach(function(b){b.onclick=function(){var v=+b.dataset.v;if(v<0)delete S.manual[S.round];else S.manual[S.round]=v;save();setPick('pMan',v);render();};});

function showStart(){
  document.getElementById('start').classList.remove('hidden');document.getElementById('game').classList.add('hidden');
  document.body.className='';document.getElementById('hTitle').textContent='Добро пожаловать';document.getElementById('hSub').textContent='Выбери свой зал и номер в тройке';refreshStart();
}
function showGame(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('manual').classList.remove('open');render();}

function nav(){
  var h='';for(var r=0;r<3;r++){var cls=(r===S.round?'active':'')+(S.unlocked[r]?'':' locked');h+='<button class="'+cls+'" onclick="goRound('+r+')"><b>'+(S.unlocked[r]?'Р'+(r+1):'🔒')+'</b>Раунд '+(r+1)+'</button>';}
  document.getElementById('nav').innerHTML=h;
}
function goRound(r){S.round=r;save();document.getElementById('manual').classList.remove('open');render();window.scrollTo(0,0);}
function render(){
  nav();
  var r=S.round,st=document.getElementById('stage');
  if(!S.unlocked[r]){
    document.body.className='';
    document.getElementById('hTitle').textContent='Зал '+(S.zal+1)+' · №'+S.num;document.getElementById('hSub').textContent='Раунд '+(r+1)+' ещё закрыт';
    st.innerHTML='<div class="lock"><div class="lock-ico">🔒</div><p class="lock-t">Раунд '+(r+1)+' заблокирован</p><p class="lock-s">Тренер назовёт кодовое слово.</p><input id="pw" type="text" placeholder="кодовое слово..." onkeydown="if(event.key===\'Enter\')tryUnlock()"><button onclick="tryUnlock()">Открыть</button><p class="lock-err" id="pwErr">Неверное слово, попробуй ещё раз</p></div>';
    setTimeout(function(){var i=document.getElementById('pw');if(i)i.focus();},100);return;
  }
  var ro=myRole(r),R=ROLES[ro],key=''+r+S.zal;
  document.body.className='r-'+R.k;
  document.getElementById('hTitle').textContent=R.t;
  document.getElementById('hSub').textContent='Зал '+(S.zal+1)+' · твой номер '+S.num;
  var trio='';for(var x=0;x<3;x++){var n=[1,2,3].filter(function(q){return roleOf(q,r)===x;})[0];trio+='<span'+(n===S.num?' class="me"':'')+'>№'+n+' '+ROLES[x].n+'</span>';}
  var man=(S.manual[r]!==undefined)?' <span style="opacity:.7;font-size:12px;">(выбрано вручную)</span>':'';
  var body='<div class="banner '+R.k+'"><p class="banner-l">Раунд '+(r+1)+' · Зал '+(S.zal+1)+'</p><p class="banner-t">Ты — '+R.n+man+'</p><div class="trio">'+trio+'</div></div>';
  var c=DATA[R.k][key];
  if(R.k==='o') c=DATA.o_pre+c+DATA.o_fb;
  st.innerHTML=body+'<div class="role-'+R.k+'">'+c+'</div>';
  if(R.k==='o'){var cid='r'+r+'z'+S.zal;(scores[cid]||[]).forEach(function(a,qi){if(a){var el=document.getElementById(cid+'q'+qi+'-'+a.type);if(el)el.classList.add(a.type);}});if(scores[cid])updateScore(cid,4);}
}
function tryUnlock(){
  var r=S.round,v=document.getElementById('pw').value.trim().toLowerCase();
  if(v===PW[r]){S.unlocked[r]=true;save();render();window.scrollTo(0,0);}
  else{var e=document.getElementById('pwErr');e.style.visibility='visible';setTimeout(function(){e.style.visibility='hidden';},2500);}
}
load();
if(S.zal!==null&&S.num)showGame();else showStart();
</script>
</body></html>
